<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A question for you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Graduate&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --felt: #C2185B;
    --felt-deep: #7E0E3C;
    --grad-a: #F06292;
    --grad-b: #B0154F;
    --stitch: #FFFDF8;
    --gold: #F2B233;
    --blush: #FFE3EC;
    --ink: #2A0A16;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --felt: #A3144C; --felt-deep: #5E0A2D; --grad-a: #C84A78; --grad-b: #8A1040; }
  }
  :root[data-theme="dark"] { --felt: #A3144C; --felt-deep: #5E0A2D; --grad-a: #C84A78; --grad-b: #8A1040; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { height: 100%; margin: 0; }
  body {
    background:
      radial-gradient(circle at 20% 15%, rgba(255,255,255,.06), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(0,0,0,.2), transparent 50%),
      linear-gradient(160deg, var(--grad-a) 0%, var(--grad-b) 100%);
    background-color: var(--felt);
    color: var(--stitch);
    font-family: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  main {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 22px;
    text-align: center;
    gap: 28px;
  }
  .pennant {
    position: relative;
    width: min(88vw, 380px);
    padding: 26px 64px 26px 22px;
    background: var(--gold);
    color: var(--ink);
    clip-path: polygon(0 0, 100% 50%, 0 100%);
    font-family: "Graduate", "Rockwell", Georgia, serif;
    font-size: clamp(1.4rem, 7vw, 2rem);
    text-align: left;
    line-height: 1;
    transform: rotate(-4deg);
  }
  .pennant::before {
    content: "";
    position: absolute;
    inset: 6px;
    border: 2px dashed rgba(42,10,22,.45);
    clip-path: polygon(0 0, 100% 50%, 0 100%);
  }
  h1 {
    font-family: "Graduate", "Rockwell", Georgia, serif;
    font-weight: 400;
    font-size: clamp(2rem, 10vw, 3.2rem);
    line-height: 1.08;
    margin: 0;
    max-width: 14ch;
    text-shadow: 0 3px 0 var(--felt-deep);
  }
  .buttons {
    display: flex;
    gap: 16px;
    align-items: center;
    justify-content: center;
    min-height: 90px;
  }
  button {
    font-family: "Graduate", "Rockwell", Georgia, serif;
    font-size: 1.5rem;
    border: 3px solid var(--stitch);
    border-radius: 999px;
    padding: 16px 34px;
    cursor: pointer;
    transition: transform .25s ease, font-size .25s ease, padding .25s ease;
  }
  button:focus-visible { outline: 3px solid var(--gold); outline-offset: 4px; }
  #yes {
    background: var(--stitch);
    color: var(--felt);
    box-shadow: 0 5px 0 var(--felt-deep);
  }
  #yes:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--felt-deep); }
  #no {
    background: transparent;
    color: var(--stitch);
    font-family: "Nunito", system-ui, sans-serif;
    font-weight: 800;
    font-size: 1.1rem;
    padding: 14px 26px;
    white-space: nowrap;
    z-index: 5;
  }
  #no.loose { position: fixed; transition: left .22s ease, top .22s ease, transform .22s ease; }
  .hint {
    font-weight: 600;
    font-size: 1rem;
    min-height: 1.4em;
    margin: 0;
    color: var(--blush);
  }
  #loading { display: none; }
  .loading-state #loading { display: flex; }
  .loading-state #ask { display: none; }
  .loader-label {
    font-weight: 800;
    font-size: 1.15rem;
    min-height: 1.5em;
    margin: 0;
    max-width: 24ch;
  }
  .bar {
    width: min(80vw, 320px);
    height: 26px;
    border: 3px solid var(--stitch);
    border-radius: 999px;
    padding: 3px;
  }
  .bar-fill {
    height: 100%;
    width: 0%;
    max-width: 100%;
    border-radius: 999px;
    background: repeating-linear-gradient(-45deg, var(--gold) 0 10px, #FFD36B 10px 20px);
    transition: width .35s ease;
  }
  .bar.overload .bar-fill { background: var(--blush); }
  .bar.overload { animation: shake .35s ease 3; }
  .pct {
    font-family: "Graduate", "Rockwell", Georgia, serif;
    font-size: clamp(3rem, 16vw, 4.5rem);
    line-height: 1;
    margin: 0;
    text-shadow: 0 3px 0 var(--felt-deep);
  }
  .error { color: var(--blush); }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
  }
  #letter { display: none; }
  .letter-state #letter { display: flex; }
  .letter-state #ask { display: none; }
  .scene { position: relative; padding-top: 96px; }
  .bunny {
    position: absolute; left: 50%; top: 0;
    width: 130px; transform: translateX(-50%);
    transition: transform .6s cubic-bezier(.4,-0.3,.6,1.4), opacity .4s ease .2s;
    z-index: 1;
  }
  .bunny svg { display: block; width: 100%; }
  .envelope {
    position: relative;
    width: min(78vw, 300px);
    aspect-ratio: 3 / 2;
    cursor: pointer;
    perspective: 700px;
    z-index: 2;
  }
  .env-back, .env-front { position: absolute; inset: 0; border-radius: 10px; }
  .env-back { background: #FFC2D6; }
  .env-front {
    background: #FFA6C3;
    clip-path: polygon(0 0, 50% 55%, 100% 0, 100% 100%, 0 100%);
    z-index: 3;
  }
  .letter-card {
    position: absolute; left: 7%; right: 7%; top: 6%; height: 88%;
    background: #FFFFFF; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    padding: 12px; text-align: center;
    font-family: "Caveat", "Bradley Hand", cursive;
    font-size: clamp(1.4rem, 6.5vw, 1.8rem); line-height: 1.1;
    color: var(--ink);
    z-index: 1;
    transition: transform .8s cubic-bezier(.3,1.3,.5,1) .5s;
  }
  .env-flap {
    position: absolute; left: 0; right: 0; top: 0; height: 58%;
    background: #FF8AB0;
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: top center;
    transition: transform .55s ease, z-index 0s linear .28s;
    z-index: 4;
  }
  .seal {
    position: absolute; left: 50%; top: 58%; width: 38px; height: 38px;
    transform: translate(-50%, -50%);
    border-radius: 50%; background: #C2185B; color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.1rem; z-index: 5;
    transition: opacity .2s ease, transform .3s ease;
  }
  .paw {
    position: absolute; top: -10px; width: 30px; height: 22px;
    background: #F4ECFF; border: 3px solid #5A3E6E; border-radius: 50%;
    z-index: 6; transition: opacity .3s ease;
  }
  .paw.l { left: 34%; } .paw.r { right: 34%; }
  .envelope.open .env-flap { transform: rotateX(180deg); z-index: 0; }
  .envelope.open .seal { opacity: 0; transform: translate(-50%, -50%) scale(.4); }
  .envelope.open .paw { opacity: 0; }
  .envelope.open .letter-card { transform: translateY(-70%); }
  .scene.opened .bunny { transform: translateX(-190%) translateY(-30px) rotate(-18deg); opacity: 0; }
  #openBtn {
    background: var(--stitch); color: var(--felt);
    box-shadow: 0 5px 0 var(--felt-deep);
    font-size: 1.25rem; padding: 14px 30px;
  }
  .envelope:not(.open) { animation: wiggle 2.4s ease-in-out 1s infinite; }
  @keyframes wiggle {
    0%, 88%, 100% { transform: rotate(0); }
    91% { transform: rotate(-3deg); } 94% { transform: rotate(3deg); } 97% { transform: rotate(-2deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .envelope, .env-flap, .letter-card, .bunny { animation: none; transition: none; }
  }
  #photos { display: none; }
  .photos-state #photos { display: flex; }
  .photos-state #ask { display: none; }
  .polaroid {
    background: #FFFFFF;
    padding: 12px 12px 0;
    width: min(84vw, 360px);
    box-shadow: 0 14px 30px rgba(0,0,0,.35);
    transform: rotate(var(--tilt, -3deg));
    transition: transform .4s ease, opacity .3s ease;
  }
  .polaroid.swap { opacity: 0; transform: rotate(var(--tilt, -3deg)) translateY(18px) scale(.96); }
  .polaroid img {
    display: block;
    width: 100%;
    max-width: 100%;
    max-height: 48vh;
    object-fit: cover;
    background: #eee;
  }
  .polaroid figcaption {
    font-family: "Caveat", "Bradley Hand", "Comic Sans MS", cursive;
    font-size: clamp(1.5rem, 7vw, 1.9rem);
    color: var(--ink);
    padding: 12px 6px 16px;
    line-height: 1.1;
  }
  .tape {
    width: 90px; height: 26px;
    background: rgba(242,178,51,.75);
    margin: -26px auto 0;
    transform: rotate(4deg);
    position: relative;
  }
  .dots { display: flex; gap: 8px; }
  .dots span { width: 9px; height: 9px; border-radius: 50%; background: rgba(255,253,248,.35); }
  .dots span.on { background: var(--gold); }
  #next {
    background: var(--stitch);
    color: var(--felt);
    box-shadow: 0 5px 0 var(--felt-deep);
    font-size: 1.25rem;
    padding: 14px 32px;
  }
  .teaser h1 { max-width: 12ch; }
  @media (prefers-reduced-motion: reduce) { .polaroid { transition: none; } }
  .spin-wrap { perspective: 800px; }
  .spin {
    position: relative;
    width: min(62vw, 31vh, 300px);
    border: 6px solid var(--stitch);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 16px 36px rgba(0,0,0,.35);
    animation: batspin 1.5s cubic-bezier(.2,.7,.3,1) both;
  }
  .spin img { display: block; width: 100%; max-width: 100%; aspect-ratio: 3 / 4; }
  .eye-heart {
    position: absolute;
    width: 19%;
    transform: translate(-50%, -50%) scale(0);
    animation: heartpop .4s cubic-bezier(.3,1.6,.5,1) 1.55s forwards,
               heartbeat .9s ease-in-out 2s infinite;
  }
  .eye-heart svg { display: block; width: 100%; }
  .after-spin { opacity: 0; animation: fadein .5s ease 1.6s forwards; }
  @keyframes batspin {
    0%   { transform: scale(0) rotate(-1080deg); }
    80%  { transform: scale(1.08) rotate(10deg); }
    100% { transform: scale(1) rotate(0deg); }
  }
  @keyframes heartpop { to { transform: translate(-50%, -50%) scale(1); } }
  @keyframes heartbeat {
    0%, 100% { transform: translate(-50%, -50%) scale(1); }
    50% { transform: translate(-50%, -50%) scale(1.25); }
  }
  @keyframes fadein { to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .spin, .after-spin { animation: none; opacity: 1; }
    .eye-heart { animation: none; transform: translate(-50%, -50%); }
  }
  #done { display: none; }
  #done h1 { max-width: 12ch; }
  #done { gap: 18px; }
  #done p { font-size: 1.1rem; font-weight: 600; margin: 0; max-width: 26ch; line-height: 1.45; }
  .yes-state #ask { display: none; }
  .yes-state #done { display: flex; }
  canvas { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  @media (prefers-reduced-motion: reduce) {
    button, #no.loose { transition: none; }
  }
</style>
</head>
<body class="loading-state">
<canvas id="confetti"></canvas>

  <p class="pct" id="pct">0%</p>
  <div class="bar" id="bar"><div class="bar-fill" id="fill"></div></div>
  <p class="loader-label" id="loadLabel">Loading something important…</p>
</main>

<main id="letter">

    <div class="bunny"><svg viewBox="0 0 120 110" aria-hidden="true">

        <ellipse cx="42" cy="30" rx="5" ry="20" fill="#FFB3CC" transform="rotate(-10 42 30)"/>
        <ellipse cx="78" cy="30" rx="5" ry="20" fill="#FFB3CC" transform="rotate(12 78 30)"/>
        <ellipse cx="60" cy="78" rx="40" ry="32" fill="#F4ECFF" stroke="#5A3E6E" stroke-width="3"/>
        <circle cx="46" cy="74" r="4.5" fill="#5A3E6E"/>
        <circle cx="74" cy="74" r="4.5" fill="#5A3E6E"/>
        <circle cx="47.5" cy="72.5" r="1.4" fill="#fff"/>
        <circle cx="75.5" cy="72.5" r="1.4" fill="#fff"/>
        <ellipse cx="36" cy="86" rx="7" ry="4.5" fill="#FF9EBE"/>
        <ellipse cx="84" cy="86" rx="7" ry="4.5" fill="#FF9EBE"/>
        <path d="M56 82 L64 82 L60 87 Z" fill="#FF6F9C"/>
        <path d="M60 87 Q55 93 51 90 M60 87 Q65 93 69 90" fill="none" stroke="#5A3E6E" stroke-width="2.4" stroke-linecap="round"/>
      </svg></div>
    <div class="envelope" id="envelope" role="button" tabindex="0" aria-label="Open the letter">
      <div class="env-back"></div>
      <div class="letter-card">I made something just for you 💌</div>
      <div class="env-front"></div>
      <div class="env-flap"></div>
      <div class="seal" aria-hidden="true">♥</div>
      <div class="paw l"></div><div class="paw r"></div>
    </div>
  </div>
  <button id="openBtn" type="button">Open the letter</button>
</main>

<main id="photos">
  <figure class="polaroid" id="polaroid" style="margin:0">
    <div class="tape" aria-hidden="true"></div>
    <img id="photo" alt="">
    <figcaption id="caption"></figcaption>
  </figure>
  <div class="dots" id="dots" aria-hidden="true"></div>
  <button id="next" type="button">Next</button>
</main>

<main id="ask">
  <h1 id="question">Will you go to homecoming with me?</h1>
  <div class="buttons">
    <button id="yes" type="button">Yes</button>
    <button id="no" type="button">No</button>
  </div>
  <p class="hint" id="hint" aria-live="polite"></p>
</main>

  const bar = document.getElementById("bar");
  const loadLabel = document.getElementById("loadLabel");
  const steps = [
    [8,   "Loading something important…"],
    [23,  "Scanning for the cutest person in school…"],
    [41,  "Found you ✔"],
    [58,  "Measuring your smile…"],
    [76,  "Calculating how cute you are…"],
    [92,  "Almost there…"],
    [100, "Calculating how cute you are…"],
    [127, "Wait…"],
    [168, "This can't be right…"],
    [999, "Error: cuteness level too high"]
  ];
  const fast = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const delay = fast ? 450 : 900;
  let i = 0;
  function nextStep() {
    const s = steps[i];
    pct.textContent = s[0] + "%";
    fill.style.width = Math.min(s[0], 100) + "%";
    loadLabel.textContent = s[1];
    if (s[0] > 100) { bar.classList.add("overload"); pct.classList.add("error"); }
    i++;
    if (i < steps.length) {
      setTimeout(nextStep, s[0] === 100 ? delay * 1.4 : delay);
    } else {
      setTimeout(function () {
        document.body.classList.remove("loading-state");
        document.body.classList.add("letter-state");
      }, delay * 2.2);
    }
  }
  setTimeout(nextStep, 500);

  // Letter opening
  const envelope = document.getElementById("envelope");
  const scene = document.getElementById("scene");
  const openBtn = document.getElementById("openBtn");
  let opened = false;
  function openLetter() {
    if (opened) return;
    opened = true;
    scene.classList.add("opened");
    envelope.classList.add("open");
    openBtn.style.visibility = "hidden";
    document.getElementById("mailTitle").textContent = "For you ♥";
    setTimeout(function () {
      document.body.classList.remove("letter-state");
      document.body.classList.add("photos-state");
    }, fast ? 900 : 2800);
  }
  envelope.addEventListener("click", openLetter);
  envelope.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openLetter(); } });
  openBtn.addEventListener("click", openLetter);

  const photosMain = document.getElementById("photos");

  const caption = document.getElementById("caption");

  function showPhoto(n) {
    const p = photos[n];
    photo.src = p.src;

    caption.textContent = p.cap;
    polaroid.style.setProperty("--tilt", p.tilt);
    Array.from(dots.children).forEach(function (d, k) { d.classList.toggle("on", k === n); });

  function showTeaser() {

  nextBtn.addEventListener("click", function () {
    if (pi >= photos.length - 1) { showTeaser(); return; }

  function overlaps(a, b, pad) {
    return !(a.right + pad < b.left || a.left - pad > b.right ||

  }

  // Sounds made with the Web Audio API (no sound files needed)
  let audioCtx = null;
  function ctx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }

  // Game-show "wrong answer" buzzer
  function buzzer() {

      const ac = ctx(), t = ac.currentTime;
      const master = ac.createGain();
      const lp = ac.createBiquadFilter();

      master.gain.setValueAtTime(0.0001, t);
      master.gain.exponentialRampToValueAtTime(0.28, t + 0.02);

  function playRomantic(delaySec) {
    try {
      const ac = ctx();
      const startAt = ac.currentTime + delaySec;
      const bin = atob(ROMANTIC_MP3);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      ac.decodeAudioData(bytes.buffer, function (buf) {
        const src = ac.createBufferSource();
        src.buffer = buf;
        src.connect(ac.destination);
        src.start(Math.max(startAt, ac.currentTime));
      }, function () { romance(); });
    } catch (_) { romance(); }
  }

  let lastDodge = 0;
  function dodge(e) {
    if (e) { e.preventDefault(); e.stopPropagation(); }
    const now = Date.now();
    if (now - lastDodge < 200) return;
    lastDodge = now;
    buzzer();
    dodges++;
    no.textContent = lines[(dodges - 1) % lines.length];

    const scale = Math.max(0.55, 1 - dodges * 0.06);
    const yesScale = Math.min(1.6, 1 + dodges * 0.08);
    yes.style.transform = "scale(" + yesScale + ")";

    if (!no.classList.contains("loose")) {
      const r = no.getBoundingClientRect();
      no.style.left = r.left + "px";
      no.style.top = r.top + "px";
      no.classList.add("loose");
      void no.offsetWidth;
    }
    no.style.transform = "scale(" + scale + ")";

    const vw = window.innerWidth, vh = window.innerHeight;
    const w = no.offsetWidth, h = no.offsetHeight;
    const margin = 16;
    const top0 = margin + (parseFloat(getComputedStyle(document.documentElement).paddingTop) || 0);
    const yesBox = yes.getBoundingClientRect();
    const cur = no.getBoundingClientRect();

    let x, y, tries = 0, box;
    do {
      x = margin + Math.random() * Math.max(1, vw - w - margin * 2);
      y = top0 + Math.random() * Math.max(1, vh - h - top0 - margin * 2);
      box = { left: x, top: y, right: x + w, bottom: y + h };
      tries++;
    } while (tries < 40 && (overlaps(box, yesBox, 24) ||
             Math.hypot(x - cur.left, y - cur.top) < 120));

    no.style.left = x + "px";
    no.style.top = y + "px";

    if (dodges === 3) hint.textContent = "Hint: there's only one right answer.";
    if (dodges === 7) hint.textContent = "The Yes button is getting lonely.";
  }

  no.addEventListener("pointerdown", dodge);
  no.addEventListener("touchstart", dodge, { passive: false });
  no.addEventListener("click", dodge);
  no.addEventListener("pointerenter", function (e) {
    if (e.pointerType === "mouse") dodge(e);
  });

  yes.addEventListener("click", function () {
    document.body.classList.add("yes-state");
    no.style.display = "none";
    cheer();
    playRomantic(1.5);
    if (navigator.vibrate) { try { navigator.vibrate([60, 40, 120]); } catch (_) {} }
  });

  function confetti() {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const c = document.getElementById("confetti");
    const ctx = c.getContext("2d");
    const dpr = window.devicePixelRatio || 1;
    c.width = innerWidth * dpr; c.height = innerHeight * dpr;
    ctx.scale(dpr, dpr);
    const colors = ["#FFFDF8", "#FFB3CC", "#FF4F8B", "#F2B233"];
    const bits = Array.from({ length: 160 }, function () {
      return {
        x: innerWidth / 2 + (Math.random() - .5) * 60,
        y: innerHeight * .55,
        vx: (Math.random() - .5) * 12,
        vy: -Math.random() * 14 - 6,
        s: 6 + Math.random() * 7,
        r: Math.random() * Math.PI,
        vr: (Math.random() - .5) * .3,
        heart: Math.random() < .25,
        col: colors[Math.floor(Math.random() * colors.length)]
      };
    });
    let frames = 0;
    (function tick() {
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      bits.forEach(function (b) {
        b.vy += .32; b.vx *= .99; b.x += b.vx; b.y += b.vy; b.r += b.vr;
        ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.r);
        ctx.fillStyle = b.col;
        if (b.heart) {
          ctx.font = (b.s * 2) + "px serif";
          ctx.fillText("♥", -b.s / 2, b.s / 2);
        } else {
          ctx.fillRect(-b.s / 2, -b.s / 4, b.s, b.s / 2);
        }
        ctx.restore();
      });
      if (++frames < 260) requestAnimationFrame(tick);
      else ctx.clearRect(0, 0, innerWidth, innerHeight);
    })();
  }
})();
